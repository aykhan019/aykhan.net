<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="KWES terminal window showing validate and dry-run commands">
  <rect width="640" height="360" fill="#0d1117"/>
  <rect x="0" y="0" width="640" height="34" fill="#1c232c"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="41" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="82" y="22" fill="#6e7681">kwes — Kapital Web Exposure Scanner</text>
    <text x="24" y="72" fill="#3fb950">$</text>
    <text x="40" y="72" fill="#c9d1d9">kwes validate --scope targets/scope.yaml</text>
    <text x="24" y="100" fill="#3fb950">configuration is valid</text>
    <text x="24" y="124" fill="#6e7681">  to target:    10 req/s max</text>
    <text x="24" y="146" fill="#6e7681">  capabilities: none (read-only)</text>
    <text x="24" y="188" fill="#3fb950">$</text>
    <text x="40" y="188" fill="#c9d1d9">kwes scan --scope targets/scope.yaml --dry-run</text>
    <text x="24" y="216" fill="#f06449">dry run - nothing will be executed</text>
    <text x="24" y="248" fill="#c9d1d9">subfinder → dnsx → httpx → katana → jsluice →</text>
    <text x="24" y="270" fill="#c9d1d9">ffuf → nuclei → normalization</text>
    <text x="24" y="306" fill="#6e7681">7 stages · one traffic budget · findings unverified</text>
    <text x="24" y="336" fill="#3fb950">$</text>
    <rect x="40" y="325" width="8" height="14" fill="#c9d1d9"/>
  </g>
</svg>
